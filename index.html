<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#171d27">
<title>Hurda Heykel Atölyesi</title>
<style>
:root{--bg:#171d27;--pn:#202837;--ln:#2f3a4d;--tx:#e4e8f0;--mu:#98a3b8;--ac:#6fd6ff;--ok:#62d99a;--wn:#f2c14e;--bd:#ff7a7a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;display:flex;justify-content:center;background:var(--bg);color:var(--tx);font:15px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{display:flex;flex-direction:column;width:100%;max-width:560px;height:100%;min-height:0}
header{padding:6px}
.btns{display:flex;gap:4px}
button{font:inherit;color:var(--tx);background:#2a3447;border:1px solid var(--ln);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btns button{flex:1;padding:8px 2px;font-size:12px}
.go{background:var(--ac);border-color:var(--ac);color:#06222c;font-weight:700}
.stagewrap{flex:1;min-height:0;position:relative}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#status{position:absolute;left:8px;right:52px;top:8px;z-index:2;padding:4px 10px;border-radius:10px;background:#171d27cc;font-size:13px;line-height:1.35;color:var(--mu);pointer-events:none;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
#status:empty{display:none}
.snd{position:absolute;top:8px;right:8px;z-index:3;width:36px;height:36px;padding:0;border-radius:50%;background:#171d27cc;font-size:16px}
#status.ok{color:var(--ok)}#status.bad{color:var(--bd)}
.tools{position:absolute;left:6px;right:6px;bottom:6px;z-index:2;display:flex;gap:4px}
.tools button{flex:1;padding:7px 2px;font-size:13px;background:#171d27d9}
.tabs{display:flex;gap:4px;padding:6px 6px 0;background:var(--pn);border-top:1px solid var(--ln)}
.tabs button{flex:1;min-width:0;padding:6px 0;font-size:10px;letter-spacing:-.2px}
.tabs button.act{background:var(--ac);border-color:var(--ac);color:#06222c;font-weight:700}
.inv{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:min-content;align-content:start;gap:4px;padding:6px;min-height:136px;background:var(--pn)}
.inv h2{display:none}
.item{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;overflow:hidden;padding:3px 1px;font-size:10px;line-height:1.1;touch-action:none;cursor:grab}
.item span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.th{width:100%;height:40px;background:linear-gradient(#f1f3f6,#cdd2da);border-radius:6px}
.selr{display:none;fill:none;stroke:#0a84ff;stroke-width:1.5;stroke-dasharray:4 3}
.sel .selr{display:block}
.bob{animation:bob .45s ease-in-out infinite alternate}
.rig{transform-box:view-box;transform-origin:var(--ox) var(--oy)}
.swing{animation:swing var(--d,.45s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
.loc{transform-box:fill-box;transform-origin:center}
.blink{animation:blink 3.2s infinite}
.talk{animation:talk .35s ease-in-out infinite alternate}
.wig{animation:wig .3s ease-in-out infinite alternate}
.boing{transform-origin:50% 100%;animation:boing .45s ease-in-out infinite alternate}
.flutter{transform-origin:50% 0;animation:flutter .45s ease-in-out infinite alternate}
.spin{animation:spin 1.6s linear infinite}
.glow{animation:glow .9s ease-in-out infinite alternate}
.roll{animation:roll var(--dt,2s) linear infinite alternate}
#items.driving{animation:drive var(--dt,2s) linear infinite alternate}
#items.still,#items.still .bob,#items.still .rig,#items.still .loc,#items.still .pf{animation:none!important}
@keyframes bob{to{transform:translateY(-3px)}}
@keyframes swing{from{transform:rotate(calc(var(--a)*-1deg))}to{transform:rotate(calc(var(--a)*1deg))}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes talk{to{transform:scaleY(1.7)}}
@keyframes wig{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes boing{to{transform:scaleY(.8)}}
@keyframes flutter{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes roll{to{transform:rotate(var(--wd,720deg))}}
.shake{animation:shake .07s linear infinite alternate}
.turn{animation:turn .9s ease-in-out infinite alternate}
.pf{fill:#d5d9e0;opacity:0;transform-box:fill-box;transform-origin:center;animation:puff 1.2s ease-out infinite}
@keyframes shake{from{transform:translate(-1.2px,-.6px)}to{transform:translate(1.2px,.6px)}}
@keyframes turn{from{transform:rotate(-35deg)}to{transform:rotate(35deg)}}
@keyframes puff{0%{opacity:.75;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(-28px,-16px) scale(2.6)}}
@keyframes drive{from{transform:translateX(calc(var(--dd)*-1))}to{transform:translateX(var(--dd))}}
@keyframes glow{to{filter:brightness(1.4)}}
.ghost{position:fixed;width:64px;pointer-events:none;transform:translate(-50%,-50%);z-index:9;opacity:.92}
.log{display:none;position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:560px;bottom:0;max-height:48dvh;overflow:auto;z-index:20;background:var(--pn);border:1px solid var(--ln);border-radius:14px 14px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.log.open{display:block}
.log div{padding:3px 0}
.close{float:right;padding:6px 12px}
.ok{color:var(--ok)}.warn{color:var(--wn)}.bad{color:var(--bd)}.mu{color:var(--mu)}
.log .verdict{font-weight:700;padding:8px 10px;border-radius:8px;margin-bottom:6px}
.log .verdict.ok{background:#62d99a1f}.log .verdict.bad{background:#ff7a7a1f}
body.circ .tools [data-a]{display:none}
.tools .cm{display:none}
body.circ .tools .cm{display:block}
#items.dim{opacity:.38;pointer-events:none}
.lit{filter:drop-shadow(0 0 6px #ffd95a) brightness(1.35)}
.thit{fill:transparent;cursor:crosshair}
.term{fill:#e7c25a;stroke:#6e5420;stroke-width:1.2;pointer-events:none}
.term.pos{fill:#ff5a4a}.term.neg{fill:#333}
.wire{fill:none;stroke-width:4.5;stroke-linecap:round;pointer-events:none}
.whit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke}
.wsel{display:none;fill:none;stroke:#0a84ff;stroke-opacity:.45;stroke-width:10;stroke-linecap:round;pointer-events:none}
.sel>.wsel{display:block}
.wflow{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-dasharray:3 10;animation:dash .5s linear infinite;pointer-events:none}
.wprev{fill:none;stroke:#0a84ff;stroke-width:3;stroke-dasharray:5 5;pointer-events:none}
.cc.run{filter:drop-shadow(0 0 7px #35c8ff)}
.clab{font:700 10px Arial,sans-serif;fill:#26303f;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
@keyframes dash{to{stroke-dashoffset:-13}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

      <button data-a="rotL" title="Sola çevir">Sola</button><button data-a="rotR" title="Sağa çevir">Sağa</button>
      <button data-a="big">Büyüt</button><button data-a="small">Küçült</button>
      <button data-a="copy" title="Kopyala">Kopya</button><button data-a="front" title="Öne al">Öne</button><button data-a="del">Sil</button>
      <button class="cm" data-ca="drive" title="Motorun hangi bölümü oynatacağını değiştir">Bağla</button><button class="cm" data-ca="del">Sil</button><button class="cm" data-ca="wires" title="Tüm kabloları sil">Kablo sil</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="inv" id="inv"></div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);

/* ========== 1) VERİ MODELİ ========== */
// w,h: boyut (px), m: ağırlık, v: değer (₺), e: elektronik mi
// Masadaki her parça: {id, t:tür, x, y, r:derece, s:ölçek}. Zemin çizgisi y=FLOOR.
let VW=400, FLOOR=486; // görünür dünya genişliği ve zemin çizgisi (ekrana göre fit() ayarlar)
const KEY="hurda-heykel.v4";
const PARTS={
  // Gövde
  can:{g:"Gövde",n:"Konserve",w:70,h:92,m:3,v:6},
  bcan:{g:"Gövde",n:"Boya kutusu",w:60,h:86,m:3,v:6},
  soda:{g:"Gövde",n:"Kola kutusu",w:56,h:88,m:2,v:5},
  tuna:{g:"Gövde",n:"Ton kutusu",w:76,h:40,m:2,v:4},
  spice:{g:"Gövde",n:"Baharat",w:58,h:78,m:2.5,v:6},
  bottle:{g:"Gövde",n:"Cam şişe",w:40,h:120,m:3.5,v:9},
  cube:{g:"Gövde",n:"Bakır blok",w:56,h:70,m:3.5,v:8},
  ball:{g:"Gövde",n:"Cam küre",w:46,h:46,m:2.5,v:7},
  frame:{g:"Araç",n:"Şase",w:190,h:18,m:2,v:5},
  // Taban
  pan:{g:"Taban",n:"Tava",w:190,h:56,m:4,v:8},
  plank:{g:"Taban",n:"Kalas",w:220,h:34,m:5,v:7},
  disc:{g:"Taban",n:"Sac plaka",w:200,h:28,m:4,v:6},
  woodbox:{g:"Taban",n:"Ahşap kutu",w:210,h:58,m:5,v:9},
  tin:{g:"Taban",n:"Kalıp",w:70,h:32,m:1.5,v:4},
  // Kafa
  bowl:{g:"Kafa",n:"Kevgir",w:70,h:50,m:2,v:5},
  lid:{g:"Kafa",n:"Tencere",w:80,h:44,m:2,v:5},
  bulb:{g:"Kafa",n:"Ampul",w:44,h:64,m:.8,v:6},
  funnel:{g:"Kafa",n:"Huni",w:56,h:62,m:1,v:3},
  block:{g:"Kafa",n:"Ahşap blok",w:56,h:52,m:1.5,v:4},
  // Mutfak aletleri
  spoon:{g:"Mutfak",n:"Kaşık",w:26,h:110,m:1,v:3},
  fork:{g:"Mutfak",n:"Çatal",w:26,h:110,m:1,v:3},
  knife:{g:"Mutfak",n:"Bıçak",w:24,h:120,m:1.2,v:4},
  ladle:{g:"Mutfak",n:"Kepçe",w:34,h:110,m:1.3,v:4},
  whisk:{g:"Mutfak",n:"Çırpıcı",w:30,h:110,m:.8,v:4},
  spatula:{g:"Mutfak",n:"Spatula",w:30,h:104,m:1,v:4},
  masher:{g:"Mutfak",n:"Et tokmağı",w:40,h:112,m:2,v:5},
  // El aletleri ve çubuklar
  wrench:{g:"Alet",n:"Anahtar",w:36,h:110,m:2,v:6},
  hammer:{g:"Alet",n:"Çekiç",w:56,h:110,m:2.5,v:6},
  driver:{g:"Alet",n:"Tornavida",w:24,h:110,m:1,v:4},
  pliers:{g:"Alet",n:"Pense",w:44,h:100,m:1.5,v:5},
  stick:{g:"Alet",n:"Çubuk",w:10,h:120,m:.6,v:2},
  rod:{g:"Alet",n:"Dişli çubuk",w:18,h:110,m:1,v:3},
  hose:{g:"Alet",n:"Hortum",w:34,h:100,m:1,v:4},
  hook:{g:"Alet",n:"Kuyruk teli",w:44,h:92,m:.5,v:3},
  chain:{g:"Alet",n:"Zincir",w:20,h:84,m:1,v:4},
  // Bağlantı parçaları
  bolt:{g:"Detay",n:"Cıvata",w:64,h:18,m:.6,v:2},
  nut:{g:"Detay",n:"Somun",w:30,h:30,m:.4,v:1},
  washer:{g:"Detay",n:"Rondela",w:30,h:30,m:.3,v:1},
  cap:{g:"Detay",n:"Kapak",w:30,h:30,m:.3,v:1},
  spring:{g:"Detay",n:"Yay",w:26,h:40,m:.3,v:2},
  tab:{g:"Detay",n:"Halka",w:28,h:38,m:.2,v:2},
  knob:{g:"Detay",n:"Pirinç top",w:28,h:28,m:.4,v:2},
  domino:{g:"Detay",n:"Domino",w:34,h:20,m:.5,v:2},
  // Süs ve dönen parçalar
  eye:{g:"Süs",n:"Oyuncak göz",w:38,h:38,m:.3,v:3},
  brush:{g:"Süs",n:"Tel fırça",w:44,h:40,m:.2,v:2},
  sheet:{g:"Süs",n:"Sac kulak",w:44,h:48,m:.5,v:2},
  gear:{g:"Süs",n:"Dişli",w:40,h:40,m:.6,v:3},
  wheel:{g:"Araç",n:"Tekerlek",w:36,h:36,m:.6,v:3},
  dial:{g:"Süs",n:"Kadran",w:44,h:44,m:.5,v:3},
  tire:{g:"Araç",n:"Lastik",w:44,h:44,m:.8,v:4},
  engine:{g:"Araç",n:"Motor bloğu",w:64,h:48,m:3,v:9},
  pipe:{g:"Araç",n:"Egzoz",w:64,h:16,m:.8,v:3},
  steer:{g:"Araç",n:"Direksiyon",w:38,h:38,m:.5,v:3},
  seat:{g:"Araç",n:"Koltuk",w:30,h:36,m:1,v:3},
  lamp:{g:"Araç",n:"Far",w:26,h:26,m:.4,v:3},
  shell:{g:"Kasa",n:"Spor kaporta",w:170,h:58,m:5,v:12},
  cab:{g:"Kasa",n:"Kamyon kabini",w:70,h:70,m:4,v:9},
  box:{g:"Kasa",n:"Kasa",w:120,h:64,m:4,v:7},
  door:{g:"Kasa",n:"Kapı",w:52,h:36,m:1.5,v:4},
  window:{g:"Kasa",n:"Cam",w:40,h:28,m:.6,v:3},
  fender:{g:"Kasa",n:"Çamurluk",w:56,h:26,m:1,v:3},
  bumper:{g:"Kasa",n:"Tampon",w:74,h:14,m:1,v:3},
  grille:{g:"Kasa",n:"Izgara",w:36,h:30,m:.8,v:3},
  spoiler:{g:"Kasa",n:"Spoyler",w:60,h:24,m:.8,v:3}
};
const known=k=>Object.hasOwn(PARTS,k);
let items=[], nid=1, selId=null, arm=null;
const E=i=>PARTS[i.t].e, byT=t=>items.filter(i=>i.t===t);

/* ========== 2) GEOMETRİ ========== */
function hext(i){ // döndürülmüş parçanın yarı genişlik/yüksekliği
  const p=PARTS[i.t],a=i.r*Math.PI/180,c=Math.abs(Math.cos(a)),s=Math.abs(Math.sin(a)),w=p.w*i.s,h=p.h*i.s;
  return {hx:(w*c+h*s)/2,hy:(w*s+h*c)/2};
}
const touch=(a,b,t=6)=>{const A=hext(a),B=hext(b);return Math.abs(a.x-b.x)<=A.hx+B.hx+t&&Math.abs(a.y-b.y)<=A.hy+B.hy+t};
const nbrs=i=>items.filter(o=>o!==i&&touch(i,o));
function settle(i){ // tuvalin içinde kal, zemine yakınsa zemine otur
  const {hx,hy}=hext(i);
  i.x=Math.round(Math.min(VW-hx,Math.max(hx,i.x))); i.y=Math.round(Math.max(hy,i.y));
  if(i.y+hy>FLOOR-14)i.y=Math.round(FLOOR-hy);
}

/* ========== 3) ELEKTRİK (sonra) ========== */
// Devre sistemi kurulunca bu değer pil, kablo ve motor bağlantısından gelecek;
// false iken robot hareket etmez. Şimdilik mekanik önizleme için hep açık.
let power=true;

/* ========== 4) SANAT PUANI ========== */
const BODY=["can","bcan","soda","tuna","spice","bottle","cube","ball","shell","cab","box"], BASE=["pan","plank","disc","woodbox"];      // gövde olabilenler, taban olanlar
const HEAD=[...BODY,"bowl","lid","bulb","block"], HEADS=()=>items.filter(i=>HEAD.includes(i.t));
const LIMB=["fork","spoon","chain","knife","ladle","whisk","wrench","hammer","driver","pliers","spatula","masher","stick","rod","hose","hook","domino"];
const TOOLS=["wrench","hammer","driver","knife","ladle","whisk","pliers"];
const WHEELS=["wheel","tire"]; // dönerek aracı sürer
const BODYS=()=>items.filter(i=>BODY.includes(i.t)), BASEPARTS=()=>items.filter(i=>BASE.includes(i.t));
const isLimb=o=>LIMB.includes(o.t)||(o.t==="cap"&&nbrs(o).some(n=>n.t==="cap")); // kapak dizisi de uzuv olur
function capChain(){ // birbirine değen en büyük kapak grubu
  const caps=byT("cap"), seen=new Set(); let best=0;
  for(const c of caps){
    if(seen.has(c))continue;
    let n=0; const q=[c]; seen.add(c);
    while(q.length){const a=q.shift();n++;for(const b of caps)if(!seen.has(b)&&touch(a,b)){seen.add(b);q.push(b)}}
    best=Math.max(best,n);
  }
  return best;
}
const MOTIFS=[
  ["Balerin etek",()=>byT("tin").some(t=>BODYS().some(c=>t.y>c.y&&touch(t,c)))],
  ["Kaşık ayak",()=>byT("spoon").some(s=>s.y+hext(s).hy>=FLOOR-8||nbrs(s).some(o=>BASE.includes(o.t)))],
  ["Çatal kol",()=>byT("fork").some(f=>BODYS().some(c=>Math.abs(f.x-c.x)>30&&touch(f,c)))],
  ["Kapak eklemli uzuv",()=>capChain()>=3],
  ["Cıvata gözler",()=>HEADS().some(h=>{const e=nbrs(h).filter(o=>o.t==="bolt"||o.t==="washer");return e.some(a=>a.x<h.x)&&e.some(a=>a.x>h.x)})],
  ["Yaylı boyun",()=>byT("spring").some(s=>{const n=nbrs(s);return n.some(o=>HEAD.includes(o.t)&&o.y<s.y)&&n.some(o=>BODY.includes(o.t)&&o.y>s.y)})],
  ["Alet kol",()=>items.filter(f=>TOOLS.includes(f.t)).some(f=>BODYS().some(c=>Math.abs(f.x-c.x)>30&&touch(f,c)))],
  ["Şapkalı kafa",()=>byT("funnel").some(f=>HEADS().some(h=>f.y<h.y&&touch(f,h)))],
  ["Dişli göğüs",()=>byT("gear").some(g=>BODYS().some(b=>touch(g,b)&&Math.abs(g.x-b.x)<hext(b).hx*.6))],
  ["Cam gövde",()=>byT("bottle").some(b=>nbrs(b).length>=3)],
  ["Işıklı kafa",()=>byT("bulb").some(b=>BODYS().some(c=>b.y<c.y&&touch(b,c)))],
  ["Dört tekerlek",()=>items.filter(o=>WHEELS.includes(o.t)).length>=4],
  ["Far",()=>byT("bulb").some(b=>items.some(c=>(BODY.includes(c.t)||c.t==="frame")&&touch(b,c)&&b.y>c.y-20))],
  ["Egzoz dumanı",()=>byT("pipe").length>0&&byT("engine").length>0],
  ["Camlı kabin",()=>byT("window").some(w=>items.some(c=>["shell","cab"].includes(c.t)&&touch(w,c)))],
  ["Tam donanım",()=>["shell","cab","box","window","door","fender","bumper","grille","spoiler","seat","steer","engine","pipe","lamp"].filter(k=>byT(k).length).length>=7]
];
function artScore(out){
  const art=items.filter(i=>!E(i)); // elektronik sanat sayılmaz
  if(!art.length){out.push(["warn","🎨 Sanat: henüz hurda parça yok."]);return 0}
  let s=0;
  const kinds=new Set(art.map(i=>i.t)).size, vp=Math.min(6,kinds)*5;
  s+=vp; out.push(["ok","🎨 Çeşitlilik: "+kinds+" farklı hurda türü (+"+vp+")"]);
  const top=Math.min(...art.map(i=>i.y-hext(i).hy));
  if(items.filter(o=>WHEELS.includes(o.t)).length>=2&&!items.some(o=>["spoon","rod","domino"].includes(o.t))){s+=10;out.push(["ok","🎨 Araç: tekerlekler ve gövde bir arada (+10)"])}
  else if(art.some(i=>HEAD.includes(i.t)&&i.y<top+(Math.max(...art.map(j=>j.y+hext(j).hy))-top)*.4)){s+=10;out.push(["ok","🎨 Kafa: en üstte kevgir ya da konserve var (+10)"])}
  else out.push(["warn","🎨 Kafa yok: en üste kevgir ya da konserve koy."]);
  const symAt=ax=>art.filter(i=>art.some(o=>o.t===i.t&&Math.abs(o.x-(2*ax-i.x))<22&&Math.abs(o.y-i.y)<26)).length/art.length;
  const sym=Math.max(...art.map(i=>symAt(i.x))); // en iyi dikey simetri ekseni
  const sp=Math.round(20*sym); s+=sp;
  out.push(["ok","🎨 Simetri %"+Math.round(100*sym)+" (+"+sp+")"]);
  const found=MOTIFS.filter(([,f])=>f()).map(m=>m[0]);
  found.forEach(n=>{s+=7;out.push(["ok","✨ Keşfedildi: "+n+" (+7)"])});
  if(!found.length)out.push(["mu","✨ Gizli kombinasyonlar var: parçaları bir sanatçı gibi eşleştir."]);
  return Math.min(100,s);
}

/* ========== 5) HAREKET MANTIĞI (rig) ========== */
// Parçalara rolü yapıdan atanır: gövde (konserve) merkez alınır, ona değen dallar
// konumlarına göre kafa/boyun, kol veya bacak olur. Her dal kendi eklem noktasından oynar.
function buildRig0(){
  const plan=new Map(), R={head:[],neck:[],eye:[],mouth:[],ear:[],arm:[],leg:[],skirt:[],hat:[],gear:[],tail:[],wheel:[],engine:[],steer:[]}, cans=BODYS();
  if(!cans.length)return {plan,R,body:null};
  const heads=HEADS().sort((a,b)=>a.y-b.y);
  let head=heads[0], pool=cans.filter(c=>c!==head);
  if(!pool.length){pool=cans.slice();head=heads.find(h=>!BODY.includes(h.t)&&h.y<pool[0].y)||null}
  const body=pool.reduce((a,b)=>nbrs(b).length>nbrs(a).length?b:a);
  if(head&&head.y>=body.y)head=null;
  // gövde: üst üste konserveler ve etek (kek kalıbı) gövdeye katılır
  const torso=new Set([body]);
  for(let g=true;g;){g=false;for(const o of items)
    if(!torso.has(o)&&o!==head&&(BODY.includes(o.t)||o.t==="tin")&&[...torso].some(x=>touch(o,x)&&Math.abs(o.x-x.x)<hext(x).hx*.6)){torso.add(o);g=true}}
  const seen=new Set([...torso,...BASEPARTS()]); // tava taban, hareket etmez
  const branch=r=>{const g=[r],q=[r];seen.add(r);while(q.length){const a=q.shift();for(const b of nbrs(a))if(!seen.has(b)&&!RS.has(b)){seen.add(b);g.push(b);q.push(b)}}return g};
  const onTorso=o=>[...torso].some(x=>touch(o,x));
  const RS=new Set(items.filter(o=>!seen.has(o)&&onTorso(o)&&isLimb(o))); // gövdeye değen uzuv kökleri birbirinin dalına karışmasın
  const LG={boing:"head",blink:"eye",talk:"mouth",wig:"ear",flutter:"skirt",spin:"gear",glow:"light"}; // yerel hareket -> bölüm
  const set=(o,v)=>plan.set(o.id,{...(plan.get(o.id)||{}),bob:true,...v,...(v.loc?{locG:LG[v.loc]}:{})});
  const rg=(ox,oy,a,d,dl)=>({ox:Math.round(ox),oy:Math.round(oy),a,d,dl});
  items.forEach(o=>{if(!BASE.includes(o.t))set(o,{})}); // gövde ve dallar hafifçe zıplar
  torso.forEach(x=>{if(x.t==="tin"){R.skirt.push(x);set(x,{loc:"flutter"})}});

  // kafa dalı: boyun yayı varsa onun ucundan, yoksa kafanın altından yalpalar
  if(head){
    const neck=items.find(o=>o.t==="spring"&&!seen.has(o)&&o.y>head.y&&touch(o,head)&&onTorso(o));
    let g,ox,oy;
    if(neck){g=branch(neck).filter(o=>o!==neck);set(neck,{loc:"boing"});R.neck.push(neck);ox=neck.x;oy=neck.y-hext(neck).hy}
    else{g=branch(head);ox=head.x;oy=head.y+hext(head).hy}
    R.head.push(head);
    const H=hext(head);
    g.forEach(o=>{
      set(o,{rig:rg(ox,oy,6,1.1,0),rigG:"head"});
      if(o===head||!touch(o,head))return;
      const dy=(o.y-head.y)/H.hy, dx=(o.x-head.x)/H.hx;
      if(o.t==="tab"||(dy>.15&&Math.abs(dx)<.5&&["bolt","cap","washer","nut"].includes(o.t))){R.mouth.push(o);set(o,{loc:"talk"})}
      else if(["washer","cap","nut","eye"].includes(o.t)){R.eye.push(o);set(o,{loc:"blink"})}
      else if(o.t==="gear"||(o.t==="knob"&&Math.abs(dy)<.6)){R.eye.push(o);set(o,{loc:o.t==="gear"?"spin":"blink"})} // dişli ya da pirinç top göz olur
      else if(["bolt","brush","sheet","spring"].includes(o.t)||LIMB.includes(o.t)){R.ear.push(o);set(o,{loc:"wig"})}
      else if(o.t==="funnel"||o.t==="lid"){R.hat.push(o)}
    });
  }

  // kol ve bacaklar: gövdeye değen dallar. Alt kısımdaysa bacak, yandaysa kol.
  const tt=[...torso], top=Math.min(...tt.map(x=>x.y-hext(x).hy)), bot=Math.max(...tt.map(x=>x.y+hext(x).hy)), tx=body.x;
  const thr=(top+bot)/2+.25*(bot-top), B=hext(body);
  [...RS].sort((a,b)=>a.y-b.y).forEach(r=>{
    if(seen.has(r))return;
    const g=branch(r), leg=r.y>thr||(Math.abs(r.x-tx)<B.hx*.4&&r.y>body.y), side=r.x<tx?-1:1, A=hext(r);
    const an=leg?[tx,bot]:[tx,body.y-B.hy*.4]; // eklem: gövdeye en yakın nokta
    const ox=Math.min(r.x+A.hx,Math.max(r.x-A.hx,an[0])), oy=Math.min(r.y+A.hy,Math.max(r.y-A.hy,an[1]));
    const dl=((side<0)!==leg)?0:-.45; // yürüyüş: sol kol ile sağ bacak aynı fazda
    const tail=r.t==="hook"; // kuyruk teli ayrı bölüm: kuyruk
    g.forEach(o=>set(o,{rig:rg(ox,oy,tail?25:leg?20:30,.45,dl),rigG:tail?"tail":leg?"leg":"arm"}));
    (tail?R.tail:leg?R.leg:R.arm).push(r);
  });
  items.filter(o=>["gear","dial"].includes(o.t)).forEach(o=>{R.gear.push(o);set(o,{loc:"spin"})}); // dişli yerinde döner
  if(head&&head.t==="bulb")set(head,{loc:"glow"});                                // ampul kafa yanıp söner
  return {plan,R,body};
}

function buildRig(){ // robot rolleri + araç rolleri (tekerlek, far)
  const rig=buildRig0(), add=(o,v)=>rig.plan.set(o.id,{...(rig.plan.get(o.id)||{}),...v});
  items.filter(o=>WHEELS.includes(o.t)).forEach(o=>{rig.R.wheel.push(o);add(o,{loc:"roll",locG:"wheel"})});
  items.filter(o=>o.t==="bulb"||o.t==="lamp").forEach(o=>add(o,{loc:"glow",locG:"light"})); // ampul ve far: LED ile yanar
  items.filter(o=>o.t==="engine").forEach(o=>{rig.R.engine.push(o);add(o,{loc:"shake",locG:"engine"})}); // motor bloğu titrer
  items.filter(o=>o.t==="pipe").forEach(o=>add(o,{locG:"engine",smoke:true}));                         // egzoz duman verir
  items.filter(o=>o.t==="steer").forEach(o=>{rig.R.steer.push(o);add(o,{loc:"turn",locG:"steer"})});   // direksiyon döner
  return rig;
}

/* ========== 6) TEST ========== */
function testSystem(){
  if(!items.length)return say("Masa boş: envanterden bir parça seç ve masaya bırak.");
  const out=[]; let fatal=false;
  const ok=m=>out.push(["ok","✅ "+m]), wn=m=>out.push(["warn","⚠️ "+m]);
  const bd=m=>{out.push(["bad","❌ "+m]);fatal=true};
  const art=artScore(out);

  // a) Bütünlük: parçalar birbirine değerek tek gövde oluşturuyor mu?
  const seen=new Set([items[0]]), q=[items[0]];
  while(q.length)for(const o of nbrs(q.shift()))if(!seen.has(o)){seen.add(o);q.push(o)}
  const lost=items.length-seen.size;
  if(lost)bd(lost+" parça gövdeye tutunmuyor. Kopuk parçaları diğerlerine değecek şekilde yaklaştır.");
  else ok("Tüm parçalar birbirine değiyor, gövde tek parça.");

  // b) Zemin ve denge: ağırlık merkezi, zemine değen parçaların aralığında olmalı
  const feet=items.filter(i=>i.y+hext(i).hy>=FLOOR-6);
  let stab=0;
  if(!feet.length)bd("Robot havada duruyor: en az bir parça zemine değmeli. Tava ya da ayak ekle.");
  else{
    let M=0,X=0; items.forEach(i=>{const m=PARTS[i.t].m*i.s;M+=m;X+=m*i.x});
    const lo=Math.min(...feet.map(i=>i.x-hext(i).hx)), hi=Math.max(...feet.map(i=>i.x+hext(i).hx)), com=X/M;
    const mg=Math.min(com-lo,hi-com);
    stab=Math.max(0,Math.round(100*mg/((hi-lo)/2)));
    if(mg<0)bd("Robot devrilir: ağırlık merkezi ayakların dışında. Ağır parçaları ayakların üstüne topla ya da tabanı tava ile genişlet.");
    else if(stab<30){ok("Ayakta duruyor ama denge sınırda (%"+stab+").");wn("Tabanı genişlet: yan yana ayak ya da tava ekle.")}
    else ok("Ağırlık merkezi ayakların üstünde, denge %"+stab+".");
  }

  // c) Hareket planı: hangi parça nerede, nasıl oynayacak
  const rig=buildRig(), R=rig.R, nm=k=>[...new Set(R[k].map(o=>PARTS[o.t].n))].join(" ve ");
  const car=R.wheel.length>=2&&!R.leg.length; // araç: tekerlekli, bacaksız
  if(car){
    ok("Araç: "+R.wheel.length+" tekerlek ("+nm("wheel")+"). Motor tekerleklere bağlanınca dönüp sürer.");
    if(R.engine.length)ok("Motor bloğu: çalışınca titrer"+(items.some(o=>o.t==="pipe")?", egzozdan duman çıkar":"")+".");
    if(R.steer.length)ok("Direksiyon: bağlanınca sağa sola döner.");
    const lamps=items.filter(o=>o.t==="bulb"||o.t==="lamp").length;
    if(lamps)ok("Far: "+lamps+", LED ile yanar.");
  }
  else if(!rig.body)wn("Gövde yok: bir konserve ekle. Kafa, kol ve bacaklar gövdeye göre bulunur.");
  else{
    if(R.head.length)ok("Kafa ("+nm("head")+"): "+(R.neck.length?"boyun yayı zıplar, kafa yalpalar.":"kafa yalpalar."));
    else wn("Kafa yok: gövdenin üstüne kevgir ya da konserve değdir.");
    if(R.head.length){
      if(R.eye.length)ok("Göz: "+R.eye.length+" ("+nm("eye")+"), göz kırpar.");
      else wn("Göz yok: kafaya rondela ya da kapak değdir.");
      if(R.mouth.length)ok("Ağız ("+nm("mouth")+"): açılıp kapanır.");
      if(R.ear.length)ok("Kulak ya da anten: "+R.ear.length+", titrer.");
    }
    if(R.arm.length)ok("Kol: "+R.arm.length+" ("+nm("arm")+"), omuzdan sallanır.");
    else wn("Kol yok: gövdenin yan tarafına çatal ya da zincir değdir.");
    if(R.leg.length)ok("Bacak: "+R.leg.length+" ("+nm("leg")+"), kalçadan sırayla sallanır.");
    else wn("Bacak yok: gövdenin altına kaşık ya da çatal değdir.");
    if(R.skirt.length)ok("Etek ("+nm("skirt")+"): salınır.");
    if(R.hat.length)ok("Şapka ("+nm("hat")+"): kafayla birlikte yalpalar.");
    if(R.gear.length)ok("Dişli ya da tekerlek: "+R.gear.length+", döner.");
    if(R.tail.length)ok("Kuyruk: "+R.tail.length+", sallanır.");
  }

  // d) Elektrik devresi: hangi bölümler enerjili?
  const ev=evalCircuit(), pw=poweredGroups(ev,rig);
  if(!comps.length)out.push(["mu","Devre yok: hareket önizlemesi gösteriliyor. Devre modunda pil ve motor ekleyince yalnız bağlı bölümler oynar."]);
  else{
    if(!comps.some(c=>c.t==="battery"))wn("Pil yok: Devre modunda bir LiPo pil ekle.");
    if(ev.short.length)bd("Kısa devre: pilin + ve − uçları doğrudan birleşmiş, hiçbir şey çalışmaz.");
    comps.filter(c=>c.t==="motor").forEach(c=>ev.active.has(c.id)?ok("Motor enerjili: "+DN[driveOf(c,rig)]+" hareket ediyor."):wn("Bir motor çalışmıyor: açık devre ya da anahtar kapalı."));
    comps.filter(c=>c.t==="led").forEach(c=>ev.active.has(c.id)?ok("LED yanıyor: gözler parlıyor."):wn("LED yanmıyor: açık devre ya da anahtar kapalı."));
  }
  const em=comps.filter(c=>c.t==="motor"&&ev.active.has(c.id)).length;

  // e) Sonuç ve tahmini satış değeri (rol çeşidi ve çalışan motor arttıkça bonus)
  const rc=Object.values(R).filter(a=>a.length).length;
  const total=items.reduce((s,i)=>s+PARTS[i.t].v*i.s,0);
  const live=!fatal;
  const worth=Math.round(total*(.6+art/100)*(1+.08*rc+.12*em)*(.5+stab/200));
  const buyer=rc>=5?"çocuklar oyuncak olarak alır":art>=60?"galeri koleksiyonu için ideal":"pazar tezgahında satılır";
  draw(live&&rig.plan.size?rig.plan:null,pw);
  showLog(live
    ?["verdict ok",(comps.length?(em?"Robot canlandı":"Heykel sağlam, devre çalışmıyor"):(rc?"Heykel sağlam, hareket önizlemesi çalışıyor":"Heykel sağlam"))+": sanat "+art+"/100, tahmini değer "+worth+" ₺, "+buyer+"."]
    :["verdict bad","Test başarısız: sanat puanı "+art+"/100 ama mühendislik sorunları var."], out);
  if(live){sfxWin();setTimeout(speak,650)}else sfxFail();
}

/* ========== 7) ELEKTRİK DEVRESİ ========== */
// Mekanik modda görünmez. Devre modunda pil, motor, LED ve anahtar yerleştirilir, uçlar kabloyla bağlanır.
// Kural: kabloyla (ve kapalı anahtarla) birleşen uçlar tek hat olur. Pilin + hattından yüke, yükten pilin - hattına
// bir yol varsa yük çalışır. + ve - aynı hatta ise kısa devredir. Motor en yakın (ya da seçilen) bölümü oynatır.
const CT={ // devre elemanları: boyut ve uç noktaları (merkeze göre)
  battery:{n:"Pil",w:64,h:34,t:{n:[-30,0],p:[30,0]}},
  motor:{n:"Motor",w:56,h:30,t:{a:[-26,-8],b:[-26,8]}},
  led:{n:"LED",w:28,h:46,t:{a:[-6,20],b:[6,20]}},
  switch:{n:"Anahtar",w:48,h:28,t:{a:[-21,0],b:[21,0]}}
};
const DN={arm:"Kollar",leg:"Bacaklar",head:"Kafa",eye:"Gözler",mouth:"Ağız",ear:"Kulaklar",skirt:"Etek",gear:"Dişli",tail:"Kuyruk",wheel:"Tekerlekler",engine:"Motor bloğu",steer:"Direksiyon",body:"Gövde"};
let comps=[], wires=[], cid=1, selC=null, selW=null, wirePrev=null, cev=null, crig=null, mode="mech", cdrag=null;
const tpos=(c,k)=>({x:c.x+CT[c.t].t[k][0],y:c.y+CT[c.t].t[k][1]});
const termPos=s=>{const [id,k]=s.split(".");const c=comps.find(o=>o.id===+id);return c&&tpos(c,k)};
const clampC=c=>{c.x=Math.min(VW-20,Math.max(20,c.x));c.y=Math.min(FLOOR-10,Math.max(20,c.y))};

function evalCircuit(){
  const par={}, f=k=>par[k]===undefined?(par[k]=k):par[k]===k?k:(par[k]=f(par[k]));
  const u=(a,b)=>{par[f(a)]=f(b)};
  comps.forEach(c=>Object.keys(CT[c.t].t).forEach(k=>f(c.id+"."+k)));
  wires.forEach(w=>u(w.a,w.b));
  comps.filter(c=>c.t==="switch"&&c.on).forEach(c=>u(c.id+".a",c.id+".b")); // kapalı anahtar hattı birleştirir
  const res={active:new Set(),nets:new Set(),short:[],f};
  const E=comps.filter(c=>c.t==="motor"||c.t==="led").map(l=>[l,f(l.id+".a"),f(l.id+".b")]); // yükler hatlar arası kenar
  const reach=(s,ex)=>{
    const seen=new Set([s]), q=[s];
    while(q.length){const n=q.shift();for(const [l,x,y] of E){
      if(l===ex)continue;
      const m=x===n?y:y===n?x:null;
      if(m!==null&&!seen.has(m)){seen.add(m);q.push(m)}
    }}
    return seen;
  };
  for(const b of comps.filter(c=>c.t==="battery")){
    const P=f(b.id+".p"), N=f(b.id+".n");
    if(P===N){res.short.push(b);continue}
    let any=false;
    for(const [l,x,y] of E){
      if(x===y)continue; // uçları kabloyla birleşmiş yükten akım geçmez
      const rp=reach(P,l), rn=reach(N,l);
      if((rp.has(x)&&rn.has(y))||(rp.has(y)&&rn.has(x))){res.active.add(l.id);res.nets.add(x);res.nets.add(y);any=true}
    }
    if(any){res.nets.add(P);res.nets.add(N)}
  }
  return res;
}
const availDrives=rig=>["arm","leg","tail","head","eye","mouth","ear","skirt","gear","wheel","engine","steer"].filter(g=>rig.R[g]&&rig.R[g].length).concat("body");
function driveOf(c,rig){ // seçilmemişse robotta motora en yakın bölüm
  const av=availDrives(rig);
  if(c.drive&&av.includes(c.drive))return c.drive;
  let best="body", bd=1e9;
  av.forEach(g=>(g==="body"?[rig.body]:rig.R[g]).forEach(o=>{
    if(!o)return;
    const d=Math.hypot(o.x-c.x,o.y-c.y);
    if(d<bd){bd=d;best=g}
  }));
  return best;
}
function poweredGroups(ev,rig){ // null: devre yok (önizleme), yoksa enerjili bölümler
  if(!comps.length)return null;
  const pw=new Set();
  comps.forEach(c=>{
    if(!ev.active.has(c.id))return;
    if(c.t==="motor")pw.add(driveOf(c,rig));
    if(c.t==="led")pw.add("light");
  });
  return pw;
}
function circMsg(ev){
  if(!comps.length)return "Devre boş: pil ve motor ekle, uçlarındaki noktaları kabloyla birleştir.";
  if(!comps.some(c=>c.t==="battery"))return "Pil yok: bir LiPo pil ekle.";
  if(ev.short.length)return "Kısa devre: pilin + ve − uçları doğrudan birleşmiş!";
  const m=comps.filter(c=>c.t==="motor"&&ev.active.has(c.id)).length, l=comps.some(c=>c.t==="led"&&ev.active.has(c.id));
  if(!m&&!l)return "Açık devre: pilin + ucundan yüke, yükten pilin − ucuna kablo çek. Anahtar açık olmalı.";
  return "Çalışıyor: "+m+" motor"+(l?" ve LED":"")+" enerjili.";
}

function drawCirc(ev,rig){
  const act=ev?ev.active:new Set(), nets=ev?ev.nets:new Set(), cols=["#d92d2d","#2a2f3a","#2f6fe0","#e0a81f","#2e9e5b"];
  const rg=rig||{R:{},body:null};
  let h=comps.map(c=>{
    const d=CT[c.t], sym=c.t==="switch"?(c.on?"swon":"switch"):c.t;
    const lab=c.t==="motor"?"→ "+DN[driveOf(c,rg)]:c.t==="led"?"→ ışık":c.t==="switch"?(c.on?"açık":"kapalı"):"";
    return `<g data-c="${c.id}" class="cc${c.id===selC?" sel":""}${act.has(c.id)?" run":""}"><g filter="url(#sh)"><use href="#p-${sym}" x="${c.x-d.w/2}" y="${c.y-d.h/2}" width="${d.w}" height="${d.h}"/></g>`
      +`<rect class="selr" x="${c.x-d.w/2-3}" y="${c.y-d.h/2-3}" width="${d.w+6}" height="${d.h+6}"/>`
      +(lab?`<text class="clab" x="${c.x}" y="${c.y+d.h/2+13}">${lab}</text>`:"")+`</g>`;
  }).join("");
  h+=wires.map((w,i)=>{
    const a=termPos(w.a), b=termPos(w.b); if(!a||!b)return "";
    const sag=Math.min(46,Math.hypot(a.x-b.x,a.y-b.y)/3.5), d=`M${a.x} ${a.y}Q${(a.x+b.x)/2} ${(a.y+b.y)/2+sag} ${b.x} ${b.y}`;
    return `<g data-w="${i}" class="${i===selW?"sel":""}"><path class="wsel" d="${d}"/><path class="whit" d="${d}"/><path class="wire" stroke="${cols[i%cols.length]}" d="${d}"/>`
      +(ev&&nets.has(ev.f(w.a))?`<path class="wflow" d="${d}"/>`:"")+`</g>`;
  }).join("");
  h+=comps.flatMap(c=>Object.keys(CT[c.t].t).map(k=>{
    const q=tpos(c,k);
    return `<g data-term="${c.id}.${k}"><circle class="thit" cx="${q.x}" cy="${q.y}" r="14"/><circle class="term${k==="p"?" pos":k==="n"?" neg":""}" cx="${q.x}" cy="${q.y}" r="4.6"/></g>`;
  })).join("");
  if(wirePrev)h+=`<path class="wprev" d="M${wirePrev.x1} ${wirePrev.y1}L${wirePrev.x2} ${wirePrev.y2}"/>`;
  $("#circ").innerHTML=h;
}
function circLive(){ // her değişiklikte devreyi çöz, robotu enerjili bölümlerle oynat
  crig=buildRig(); cev=evalCircuit();
  const run=cev.active.size>0, sh=cev.short.length>0; // durum değişince ses: kısa devre, enerji geldi, enerji gitti
  if(sh&&!lastShort)sfxShort(); else if(run&&!lastRun)sfxPower(true); else if(!run&&lastRun&&!sh)sfxPower(false);
  lastShort=sh; lastRun=run;
  drawCirc(cev,crig);
  draw(crig.plan,poweredGroups(cev,crig)||new Set());
  say(circMsg(cev));
}
function addComp(t,x,y){
  const c={id:cid++,t,x:Math.round(x),y:Math.round(y)};
  if(t==="switch")c.on=true;
  clampC(c); comps.push(c); selC=c.id; selW=null; circLive(); sfxComp(t);
}

// Devre modu dokunuşları: uçtan uca sürükleyerek kablo çek, parçayı sürükleyerek taşı, anahtara dokunarak aç/kapat
function circDown(e){
  stage.setPointerCapture?.(e.pointerId);
  const p=pt(e), tm=e.target.closest("[data-term]"), cg=e.target.closest("[data-c]"), wg=e.target.closest("[data-w]");
  if(tm){
    const from=tm.dataset.term, s=termPos(from);
    cdrag={k:"wire",from}; wirePrev={x1:s.x,y1:s.y,x2:p.x,y2:p.y}; drawCirc(cev,crig); return;
  }
  selW=null;
  if(cg){
    const c=comps.find(o=>o.id===+cg.dataset.c);
    selC=c.id; cdrag={k:"move",c,dx:c.x-p.x,dy:c.y-p.y,x:e.clientX,y:e.clientY,moved:false}; drawCirc(cev,crig);
  }else if(wg){selC=null;selW=+wg.dataset.w;drawCirc(cev,crig)}
  else if(arm)addComp(arm,p.x,p.y);
  else{selC=null;drawCirc(cev,crig)}
}
addEventListener("pointermove",e=>{
  if(!cdrag)return;
  const p=pt(e);
  if(cdrag.k==="wire"){const s=termPos(cdrag.from);wirePrev={x1:s.x,y1:s.y,x2:p.x,y2:p.y};drawCirc(cev,crig)}
  else{
    if(!cdrag.moved&&Math.hypot(e.clientX-cdrag.x,e.clientY-cdrag.y)>5)cdrag.moved=true;
    if(cdrag.moved){cdrag.c.x=Math.round(p.x+cdrag.dx);cdrag.c.y=Math.round(p.y+cdrag.dy);clampC(cdrag.c);drawCirc(cev,crig)}
  }
});
addEventListener("pointerup",e=>{
  if(!cdrag)return;
  const d=cdrag; cdrag=null; wirePrev=null;
  if(d.k==="wire"){
    const to=document.elementFromPoint(e.clientX,e.clientY)?.closest("[data-term]")?.dataset.term;
    if(to&&to!==d.from&&to.split(".")[0]!==d.from.split(".")[0]&&!wires.some(w=>(w.a===d.from&&w.b===to)||(w.a===to&&w.b===d.from))){wires.push({a:d.from,b:to});sfxWire()}
  }else if(!d.moved&&d.c.t==="switch"){d.c.on=!d.c.on;sfxSwitch()}
  circLive();
});
addEventListener("pointercancel",()=>{cdrag=null;wirePrev=null});

const CACT={
  drive:()=>{
    const c=comps.find(o=>o.id===selC);
    if(!c||c.t!=="motor")return;
    const av=availDrives(crig), cur=driveOf(c,crig);
    c.drive=av[(av.indexOf(cur)+1)%av.length];
  },
  del:()=>{
    sfxDel();
    if(selC){comps=comps.filter(c=>c.id!==selC);wires=wires.filter(w=>termPos(w.a)&&termPos(w.b));selC=null}
    else if(selW!=null){wires.splice(selW,1);selW=null}
  },
  wires:()=>{wires=[];selW=null}
};
const DEMO_W=[["1.p","2.a"],["2.b","3.a"],["2.b","4.a"],["2.b","5.a"],["1.n","3.b"],["1.n","4.b"],["1.n","5.b"]]; // örnek devre kabloları

function setMode(m){
  sfxTick(); mode=m; document.body.classList.toggle("circ",m==="circ");
  $("#circ").style.display=m==="circ"?"":"none";
  $("#bMode").textContent=m==="circ"?"Mekanik":"Devre";
  arm=null; selC=null; selW=null; select(null);
  showTab(m==="circ"?"Devre":GROUPS[0]);
  if(m==="circ")circLive();
  else{draw();say("Mekanik mod: pil ve kablolar görünmez. Devre için Devre düğmesine bas.")}

/* ========== 6) KAYIT (Local Storage) ========== */
const mem={};
const store={
  get:k=>{try{return localStorage.getItem(k)}catch{return mem[k]??null}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch{mem[k]=v}}
};
function save(){
  store.set(KEY,JSON.stringify({v:5,items:items.map(({t,x,y,r,s})=>({t,x:Math.round(x-VW/2),y:Math.round(y-FLOOR),r,s})),comps:comps.map(c=>({...c,x:Math.round(c.x-VW/2),y:Math.round(c.y-FLOOR)})),wires}));
  say("Tasarım kaydedildi: "+items.length+" parça.");
}
function load(silent){
  const raw=store.get(KEY);
  if(!raw){if(!silent)say("Kayıtlı tasarım bulunamadı.");return false}
  try{
    const d=JSON.parse(raw);
    if(![4,5].includes(d.v)||!Array.isArray(d.items))throw new Error("sürüm");
    items=d.items.filter(o=>known(o.t)&&[o.x,o.y,o.r,o.s].every(Number.isFinite))
      .map(o=>({id:nid++,t:o.t,x:o.x+VW/2,y:o.y+FLOOR,r:o.r,s:Math.min(2.5,Math.max(.4,o.s))}));
    comps=(d.comps||[]).filter(c=>Object.hasOwn(CT,c.t)&&[c.x,c.y,c.id].every(Number.isFinite)).map(c=>({...c,x:c.x+VW/2,y:c.y+FLOOR}));
    const ids=new Set(comps.map(c=>c.id));
    wires=(d.wires||[]).filter(w=>ids.has(+String(w.a).split(".")[0])&&ids.has(+String(w.b).split(".")[0]));
    cid=comps.reduce((m,c)=>Math.max(m,c.id),0)+1; selC=null; selW=null;
    selId=null; draw(); if(mode==="circ")circLive();
    say(silent?"Önceki oturumdaki tasarım geri yüklendi.":"Tasarım yüklendi.");
    return true;
  }catch{
    say("Kayıt okunamadı: bozuk ya da eski sürümden. Yeni bir tasarım kaydet.");
    return false;
  }
}

/* ========== SES (Web Audio ile üretilir, harici dosya yok) ========== */
// Parça sesleri malzemeye göre (metal, cam, ahşap, lastik, yay, zincir). Robotun sesi kafasının büyüklüğü ve
// malzemesinden çıkar. Animasyon çalışırken enerjili bölümler kendi sesini çıkarır: servo, ayak sesi, göz kırpma,
// konuşma, dişli, tekerlek, motor bloğu, egzoz.
let AC=null, MG=null, NB=null, soundOn=store.get("hurda-ses")!=="0", scape=[], scapeSig="", lastAct=new Set(), lastDt=0, lastShort=false, lastRun=false;
function audio(){
  if(!soundOn)return null;
  const C=window.AudioContext||window.webkitAudioContext; if(!C)return null;
  if(!AC){
    AC=new C(); MG=AC.createGain(); MG.gain.value=.55;
    const cp=AC.createDynamicsCompressor(); MG.connect(cp); cp.connect(AC.destination);
    NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=NB.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(AC.state==="suspended")AC.resume();
  return AC;
}
const T=()=>AC.currentTime;
const pan=(g,v)=>{if(AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=v;g.connect(p);p.connect(MG)}else g.connect(MG)};
function env(g,t0,a,d,v){g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+a);g.gain.exponentialRampToValueAtTime(.0001,t0+a+d)}
function tone(f,d,o={}){
  if(!audio())return;
  const {v=.15,type="sine",f2,a=.004,pn=0,delay=0}=o, t0=T()+delay, os=AC.createOscillator(), g=AC.createGain();
  os.type=type; os.frequency.setValueAtTime(f,t0); if(f2)os.frequency.exponentialRampToValueAtTime(f2,t0+d);
  env(g,t0,a,d,v); os.connect(g); pan(g,pn); os.start(t0); os.stop(t0+a+d+.05);
}
function noise(d,o={}){
  if(!audio())return;
  const {v=.1,f=1500,q=1,type="bandpass",f2,delay=0,pn=0}=o, t0=T()+delay;
  const s=AC.createBufferSource(), fl=AC.createBiquadFilter(), g=AC.createGain();
  s.buffer=NB; fl.type=type; fl.frequency.setValueAtTime(f,t0); if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t0+d); fl.Q.value=q;
  env(g,t0,.003,d,v); s.connect(fl); fl.connect(g); pan(g,pn); s.start(t0,Math.random()*.5); s.stop(t0+d+.05);
}
function hum(o){ // sürekli ses: durdurma işlevi scape listesine eklenir
  if(!audio())return;
  const s=o.noise?AC.createBufferSource():AC.createOscillator(), fl=AC.createBiquadFilter(), g=AC.createGain(), ex=[];
  if(o.noise){s.buffer=NB;s.loop=true}else{s.type=o.type||"sawtooth";s.frequency.value=o.f}
  fl.type="lowpass"; fl.frequency.value=o.ff||500; fl.Q.value=.7;
  g.gain.setValueAtTime(.0001,T()); g.gain.exponentialRampToValueAtTime(o.v,T()+.25);
  s.connect(fl); fl.connect(g);
  if(o.pl&&AC.createStereoPanner){ // araç gidip gelirken sesi sağdan sola gezer
    const p=AC.createStereoPanner(), l=AC.createOscillator(), lg=AC.createGain();
    l.frequency.value=o.pl; lg.gain.value=.7; l.connect(lg); lg.connect(p.pan); l.start(); ex.push(l); g.connect(p); p.connect(MG);
  }else g.connect(MG);
  if(o.lf){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=o.lf;lg.gain.value=o.v*(o.ld||.5);l.connect(lg);lg.connect(g.gain);l.start();ex.push(l)}
  s.start();
  scape.push(()=>{
    const t=T(); g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(Math.max(g.gain.value,.0002),t); g.gain.exponentialRampToValueAtTime(.0001,t+.2);
    setTimeout(()=>{try{s.stop();ex.forEach(e=>e.stop())}catch{}},260);
  });
}
function every(ms,fn,first=0){
  const id0=setTimeout(()=>{fn();const id=setInterval(fn,ms);scape.push(()=>clearInterval(id))},first);
  scape.push(()=>clearTimeout(id0));
}
const stopScape=()=>{scape.forEach(f=>f());scape=[];scapeSig=""};

// --- malzemeye göre parça sesi ---
const GLASS=["bottle","bulb","ball","window","lamp","eye"], WOOD=["block","stick","woodbox","plank"], RUB=["tire","wheel","domino"];
const matOf=t=>GLASS.includes(t)?"glass":WOOD.includes(t)?"wood":RUB.includes(t)?"rubber":t==="spring"?"spring":t==="chain"?"chain":"metal";
function sfxPlace(t,q=1){
  const p=PARTS[t]||{w:40,h:40}, m=matOf(t), base=Math.max(500,2600-Math.sqrt(p.w*p.h)*14)*(.95+Math.random()*.1), v=.14*q;
  if(m==="glass"){tone(base*1.1,.7,{v:v*.9});tone(base*2.7,.35,{v:v*.3})}
  else if(m==="wood"){tone(200+Math.random()*40,.09,{v,type:"triangle"});noise(.05,{v:v*.8,f:900,q:.8})}
  else if(m==="rubber"){tone(110,.14,{v:v*1.2,f2:60});noise(.04,{v:v*.3,f:300,type:"lowpass"})}
  else if(m==="spring"){tone(420,.45,{v:v*.7,f2:160,type:"triangle"});tone(840,.4,{v:v*.2,f2:300})}
  else if(m==="chain"){for(let i=0;i<4;i++)noise(.04,{v:v*.7,f:2600+Math.random()*900,q:3,delay:i*.045})}
  else{tone(base,.5,{v:v*.8});tone(base*2.76,.28,{v:v*.35});tone(base*5.4,.14,{v:v*.2});noise(.02,{v:v*.5,f:4000})}
}
const sfxTick=()=>tone(1100,.04,{v:.07,type:"triangle"});
const sfxDel=()=>{noise(.14,{v:.1,f:3000,f2:400,q:1.2});tone(300,.1,{v:.06,f2:120})};
const sfxWire=()=>{tone(700,.07,{type:"square",v:.06,f2:1300});noise(.02,{v:.08,f:5000})};
const sfxSwitch=()=>{noise(.015,{v:.2,f:1800,q:2});tone(220,.05,{type:"square",v:.06})};
const sfxWin=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,{type:"triangle",v:.12,delay:i*.1}));
const sfxFail=()=>{tone(180,.35,{type:"sawtooth",v:.1,f2:90});tone(150,.4,{type:"sawtooth",v:.08,f2:70,delay:.18})};
const sfxShort=()=>{noise(.7,{v:.2,f:2000,q:.5,type:"highpass"});tone(110,.7,{type:"sawtooth",v:.12,f2:70});for(let i=0;i<6;i++)noise(.03,{v:.15,f:3000,q:2,delay:.08*i+Math.random()*.05})};
const sfxPower=on=>on?(tone(200,.25,{type:"sawtooth",v:.08,f2:700}),tone(900,.08,{type:"square",v:.05,delay:.2})):tone(600,.3,{type:"sawtooth",v:.07,f2:120});
function sfxComp(t){
  if(t==="battery"){tone(160,.18,{v:.12,f2:90});tone(1200,.06,{v:.06})}
  else if(t==="motor")tone(120,.3,{type:"sawtooth",v:.06,f2:300});
  else if(t==="led")tone(1800,.12,{v:.08,f2:2400});
  else sfxSwitch();
}

// --- robotun sesi: kafa büyüklüğü ve malzemesinden ---
function voice(){
  const h=HEADS().sort((a,b)=>a.y-b.y)[0]||items[0];
  if(!h)return {f:300,w:"square"};
  const m=matOf(h.t);
  return {f:Math.min(720,Math.max(170,520-hext(h).hx*4.2)),w:m==="glass"?"sine":m==="wood"?"triangle":"square"};
}
function bleep(vo,vol=.07,delay=0){
  const f=vo.f*[1,1.25,1.5,2,.75,1.8][Math.random()*6|0];
  tone(f,.05+Math.random()*.08,{type:vo.w,v:vol,f2:f*(.85+Math.random()*.4),delay,a:.006});
}
function speak(n=5+(Math.random()*4|0)){const vo=voice();for(let i=0;i<n;i++)bleep(vo,.09,i*.13+Math.random()*.03)}
const touchSfx=i=>{if(HEAD.includes(i.t)||i.t==="tab"||i.t==="eye")speak(3+(Math.random()*3|0));else sfxPlace(i.t,.45)};

// --- animasyon sesleri: hangi bölüm hareket ediyorsa sesi çalar ---
const servo=(f,d,pn=0,v=.03)=>{tone(f,d,{type:"square",v,f2:f*1.4,pn,a:.03});noise(d,{v:v*1.1,f:1800,q:2,pn})};
const clank=(pn=0)=>{tone(520+Math.random()*80,.16,{v:.06,pn});noise(.03,{v:.05,f:3000,q:2,pn})};
function setScape(act,dt){
  lastAct=act; lastDt=dt;
  const sig=[...act].sort().join(",")+"|"+(dt?dt.toFixed(1):0);
  if(sig===scapeSig)return;
  stopScape(); scapeSig=sig;
  if(!AC||!soundOn||!act.size)return;
  const vo=voice(), has=g=>act.has(g); let st=0;
  if(has("leg"))every(450,()=>{st++;servo(150,.34,st%2?-.5:.5);clank(st%2?-.5:.5)});
  if(has("arm"))every(450,()=>servo(210,.32,(st++%2)?.6:-.6));
  if(has("head"))every(1100,()=>{servo(95,.5,0,.035);tone(330,.2,{v:.03,f2:200,type:"triangle"})});
  if(has("tail"))every(500,()=>noise(.18,{v:.03,f:1200,q:1.2,f2:600}));
  if(has("eye"))every(3200,()=>{noise(.012,{v:.06,f:3500,q:4});tone(2400,.03,{v:.03})},3040);
  if(has("mouth"))every(350,()=>{if(Math.random()<.85)bleep(vo,.08)});
  if(has("ear"))every(300,()=>noise(.02,{v:.03,f:4200,q:5}));
  if(has("gear"))every(160,()=>{noise(.015,{v:.04,f:2200,q:6});tone(1800,.02,{v:.02,type:"square"})});
  if(has("skirt"))every(450,()=>noise(.2,{v:.015,f:2500,q:.5,type:"highpass"}));
  if(has("body"))every(450,()=>tone(80,.12,{v:.03,f2:55}));
  if(has("steer"))every(900,()=>tone(1500,.12,{v:.025,f2:1900}));
  if(has("wheel"))hum({noise:true,ff:260,v:.06,pl:dt?1/(2*dt):0});
  if(has("engine")){hum({type:"sawtooth",f:46,ff:380,v:.07,lf:7,ld:.7});hum({type:"square",f:92,ff:300,v:.03,lf:7,ld:.8});every(280,()=>noise(.09,{v:.035,f:500,q:.8,type:"lowpass"}))}
  if(has("light"))hum({type:"sine",f:118,ff:600,v:.018});
}
["pointerdown","pointerup","click","keydown"].forEach(ev=>addEventListener(ev,()=>{if(soundOn)audio()},{passive:true}));
addEventListener("visibilitychange",()=>{
  if(document.hidden){stopScape();AC&&AC.suspend()}else{AC&&AC.resume();setScape(lastAct,lastDt)}
});

/* ========== 7) ÇİZİM VE ARAYÜZ ========== */
const tf=i=>`translate(${i.x} ${i.y}) rotate(${i.r}) scale(${i.s})`;
function draw(plan,pw){ // plan: parça id -> animasyon bilgisi; pw: enerjili bölümler (Set), null = hepsi (devresiz önizleme)
  const A=g=>!pw||pw.has(g), root=$("#items"), act=new Set();
  const hasW=!!plan&&[...plan.values()].some(q=>q.locG==="wheel");
  let span=0;
  if(hasW&&A("wheel")&&mode!=="circ"&&items.length){ // tekerlekler enerjiliyse araç sahnede ileri geri sürer
    const lo=Math.min(...items.map(i=>i.x-hext(i).hx)), hi=Math.max(...items.map(i=>i.x+hext(i).hx));
    span=Math.max(0,Math.min(lo-12,VW-12-hi,150));
  }
  root.classList.remove("still");
  root.classList.toggle("dim",mode==="circ");
  root.classList.toggle("driving",span>10);
  root.style.setProperty("--dd",span+"px");
  root.style.setProperty("--dt",Math.max(1.4,2*span/90).toFixed(2)+"s");
  root.innerHTML=items.map(i=>{
    const p=PARTS[i.t], x=-p.w/2, y=-p.h/2, q=(plan&&plan.get(i.id))||{};
    const r=q.rig&&A(q.rigG)?q.rig:null, bob=q.bob&&A("body"), loc=q.loc&&A(q.locG)?q.loc:"";
    const lit=pw&&pw.has("light")&&(q.locG==="eye"||q.locG==="light")?" lit":"";
    const rs=r?"--ox:"+r.ox+"px;--oy:"+r.oy+"px;--a:"+r.a+";--d:"+r.d+"s;--dl:"+r.dl+"s":"";
    const puff=q.smoke&&A("engine")?'<g transform="translate('+(x-3)+' 0)"><circle class="pf" r="4"/><circle class="pf" style="animation-delay:.4s" r="4"/><circle class="pf" style="animation-delay:.8s" r="4"/></g>':"";
    const wd=loc==="roll"?"--wd:"+Math.round((span>10?2*span/(p.w*i.s/2):12.5)*57.3)+"deg":""; // yol/yarıçap kadar döner
    if(r)act.add(q.rigG); if(bob)act.add("body"); if(loc)act.add(q.locG); if(puff)act.add("engine");
    return `<g data-id="${i.id}" class="${i.id===selId?"sel":""}"><g class="${bob?"bob":""}"><g class="${r?"rig swing":""}" style="${rs}">`
      +`<g filter="url(#sh)"><g class="tf" transform="${tf(i)}"><g class="loc ${loc}${lit}" style="${wd}">`
      +`<use href="#p-${i.t}" x="${x}" y="${y}" width="${p.w}" height="${p.h}"/>${puff}</g></g></g>`
      +`<g class="tf" transform="${tf(i)}"><rect class="selr" x="${x-3}" y="${y-3}" width="${p.w+6}" height="${p.h+6}"/></g></g></g></g>`;
  }).join("");
  setScape(act,span>10?Math.max(1.4,2*span/90):0);
}
const movePart=i=>$$('[data-id="'+i.id+'"] .tf').forEach(g=>g.setAttribute("transform",tf(i)));
const select=id=>{selId=id;$$("#items [data-id]").forEach(g=>g.classList.toggle("sel",+g.dataset.id===id))};
function showLog(head,lines){
  $("#log").innerHTML=(head?'<div class="'+head[0]+'">'+head[1]+"</div>":"")
    +lines.map(([k,m])=>'<div class="'+k+'">'+m+"</div>").join("");
  const st=$("#status"); // telefonda tek satırlık durum çubuğu, ayrıntılar alttan açılan sayfada
  st.textContent=(head||lines[0]||["",""])[1].replace(/<[^>]+>/g,"");
  st.className=head?head[0].split(" ")[1]:"mu"; st.style.pointerEvents=head?"auto":"none";
  $("#logbox").classList.toggle("open",!!head);
}
const say=m=>showLog(null,[["mu",m]]);

// Masa ekranı kenardan kenara doldurur: dünya en az 400x540 birim, fazlası arka plan ve zemin olur.
// Parçalar ekran değişince orta-alt noktaya sabit kalır.
function fit(){
  const wrap=$(".stagewrap"), cw=wrap.clientWidth, ch=wrap.clientHeight;
  if(!cw||!ch)return;
  const s=Math.min(cw/400,ch/540), nw=cw/s, nh=ch/s, nf=nh-Math.max(54,48/s);
  const dx=(nw-VW)/2, dy=nf-FLOOR;
  items.forEach(i=>{i.x+=dx;i.y+=dy}); comps.forEach(c=>{c.x+=dx;c.y+=dy});
  VW=nw; FLOOR=nf;
  stage.setAttribute("viewBox","0 0 "+nw+" "+nh);
  const set=(id,o)=>{const el=$(id);for(const k in o)el.setAttribute(k,o[k])};
  set("#bg",{width:nw,height:nf}); set("#fl",{y:nf,width:nw,height:nh-nf}); set("#fl2",{y:nf,width:nw});
  if(mode==="circ")circLive();else draw();
}

// Envanter: gerçek parça çizimleriyle küçük resimler
const inv=$("#inv"), stage=$("#stage");
const thumb=t=>{const p=PARTS[t]||CT[t],m=Math.max(p.w,p.h);return `<svg class="th" viewBox="${(p.w-m)/2} ${(p.h-m)/2} ${m} ${m}"><use href="#p-${t}" width="${p.w}" height="${p.h}"/></svg>`};
const GROUPS=[...new Set(Object.values(PARTS).map(p=>p.g))];
let curTab=GROUPS[0];
function showTab(g){ // telefonda yan kaydırma olmasın diye parçalar sekmelere ayrıldı
  curTab=g;
  const circ=mode==="circ", names=circ?["Devre"]:GROUPS;
  $("#tabs").innerHTML=names.map(n=>`<button data-g="${n}" class="${n===g?"act":""}">${n}</button>`).join("");
  const list=circ?Object.entries(CT):Object.entries(PARTS).filter(([,p])=>p.g===g);
  inv.innerHTML=list.map(([k,p])=>`<button class="item" data-t="${k}">${thumb(k)}<span>${p.n}</span></button>`).join("");
  markArm();
}
$("#tabs").onclick=e=>{const b=e.target.closest("[data-g]");if(b)showTab(b.dataset.g)};

const pt=e=>{const p=stage.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(stage.getScreenCTM().inverse())};
function add(t,x,y){
  if(mode==="circ")return addComp(t,x,y);
  const i={id:nid++,t,x,y,r:0,s:1}; items.push(i); settle(i); selId=i.id; draw(); sfxPlace(t);
}
const markArm=()=>$$(".item").forEach(el=>el.classList.toggle("sel",el.dataset.t===arm));

// Sürükle-bırak (Pointer Events: fare ve dokunmatik).
// Kısa dokunuş: envanterden parçayı seç, sonra masaya dokun. Masadaki parçayı sürükleyerek taşı.
let drag=null,ghost=null;
inv.addEventListener("pointerdown",e=>{
  const b=e.target.closest(".item"); if(!b)return;
  drag={k:"new",t:b.dataset.t,x:e.clientX,y:e.clientY,moved:false};
});
stage.addEventListener("pointerdown",e=>{
  if(mode==="circ")return circDown(e);
  const g=e.target.closest("[data-id]");
  if(g){
    const i=items.find(o=>o.id===+g.dataset.id), p=pt(e);
    select(i.id); touchSfx(i);
    drag={k:"move",i,dx:i.x-p.x,dy:i.y-p.y,x:e.clientX,y:e.clientY,moved:false};
  }else if(arm){const p=pt(e);add(arm,p.x,p.y)}
  else select(null);
});
addEventListener("pointermove",e=>{
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6){
    drag.moved=true;
    if(drag.k==="move")$("#items").classList.add("still"); // sürüklerken animasyon durur
    if(drag.k==="new"){ghost=document.createElement("div");ghost.className="ghost";ghost.innerHTML=thumb(drag.t);document.body.append(ghost)}
  }
  if(!drag.moved)return;
  if(drag.k==="new"){ghost.style.left=e.clientX+"px";ghost.style.top=e.clientY+"px"}
  else{const p=pt(e);drag.i.x=p.x+drag.dx;drag.i.y=p.y+drag.dy;settle(drag.i);movePart(drag.i)}
});
addEventListener("pointerup",e=>{
  if(!drag)return;
  const d=drag; drag=null; ghost?.remove(); ghost=null;
  if(d.k!=="new")return;
  if(d.moved){
    const r=stage.getBoundingClientRect();
    if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){const p=pt(e);add(d.t,p.x,p.y)}
  }else{
    arm=arm===d.t?null:d.t; markArm(); sfxTick();
    say(arm?"Seçili: "+(PARTS[arm]||CT[arm]).n+". Masada bir yere dokun.":"Seçim kaldırıldı.");
  }
});
addEventListener("pointercancel",()=>{drag=null;ghost?.remove();ghost=null});

// Seçili parçayı düzenle
const ACT={
  rotL:i=>{i.r-=15}, rotR:i=>{i.r+=15},
  big:i=>{i.s=Math.min(2.5,+(i.s*1.1).toFixed(2))}, small:i=>{i.s=Math.max(.4,+(i.s/1.1).toFixed(2))},
  copy:i=>{const c={...i,id:nid++,x:i.x+16,y:i.y-8};items.push(c);selId=c.id},
  front:i=>{items.splice(items.indexOf(i),1);items.push(i)},

};

function buildDemo(spec){
  const out=[];
  spec.forEach(([t,ref,side,o=0,r=0,s=1,o2=0])=>{
    const c={id:nid++,t,x:VW/2,y:FLOOR,r,s}, H=hext(c);
    if(ref<0){c.y=FLOOR-H.hy;c.x=VW/2+o}
    else{
      const p=out[ref], P=hext(p), ov=4;
      if(side==="T"){c.y=p.y-P.hy-H.hy+ov;c.x=p.x+o}
      else if(side==="B"){c.y=p.y+P.hy+H.hy-ov;c.x=p.x+o}
      else if(side==="L"){c.x=p.x-P.hx-H.hx+ov;c.y=p.y+o}
      else if(side==="R"){c.x=p.x+P.hx+H.hx-ov;c.y=p.y+o}
      else{c.x=p.x+o;c.y=p.y+o2}
    }
    out.push(c);
  });
  return out;
}
let demoI=-1;
function demoCircuit(){ // robotun gövdesine göre örnek devre: anahtar, iki motor ve LED paralel
  const rig=buildRig(), R=rig.R, b=rig.body||{x:VW/2,y:FLOOR-200};
  const at=(o,dx,dy,fx,fy)=>o?{x:o.x+dx,y:o.y+dy}:{x:b.x+fx,y:b.y+fy};
  const car=R.wheel.length>=2&&!R.leg.length, bu=items.find(o=>o.t==="bulb"||o.t==="lamp"), wl=R.wheel;
  const arm=car?at(wl[0],8,-34):at(R.arm[0],0,36,-70,30), leg=car?at(wl[wl.length-1],-8,-34):at(R.leg[0],36,-24,70,70);
  const led=bu?at(bu,0,-40):at(R.head[0],0,-46,0,-80);
  comps=[["battery",b.x,b.y-4],["switch",b.x+84,b.y+30],["motor",arm.x,arm.y],["motor",leg.x,leg.y],["led",led.x,led.y]]
    .map(([t,x,y],i)=>{const c={id:i+1,t,x:Math.round(x),y:Math.round(y)};if(t==="switch")c.on=true;clampC(c);return c});
  wires=DEMO_W.map(([a,b])=>({a,b})); cid=comps.length+1; selC=null; selW=null;
}
